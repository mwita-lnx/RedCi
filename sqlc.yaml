version: "2"
sql:
  - engine: "sqlite"
    schema: "ops/db/panel/migrations"
    queries: "ops/db/panel/queries"
    gen:
      go:
        package: "store"
        out: "ops/internal/store"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "INTEGER"
            go_type: "int64"
